# ============================================================
# AECT Docker Compose - Production
# ============================================================

services:
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: aect-api
    ports:
      - "8001:8001"
    volumes:
      - ./API/weights:/app/weights:ro
      - type: tmpfs
        target: /app/uploads
        tmpfs:
          size: 1024M
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      target: runner
    container_name: aect-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - API_URL=http://api:8001
    depends_on:
      api:
        condition: service_healthy
    restart: always

networks:
  default:
    name: aect-network
    driver: bridge
